<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color"
          content="#6c2cff">

    <title>Login - Diamond Topup Zone</title>

    <link rel="stylesheet"
          href="../css/login.css">
</head>

<body>

<div class="auth-page">

    <div class="auth-card">

        <img
            src="../assets/logo.png"
            class="auth-logo"
            alt="Diamond Topup Zone">

        <h1>
            Welcome Back
        </h1>

        <p class="auth-subtitle">
            Diamond Topup Zone
        </p>


        <form id="loginForm">

            <div class="input-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="আপনার Email দিন"
                    required>

            </div>


            <div class="input-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="আপনার Password দিন"
                    required>

            </div>


            <button
                type="submit"
                class="auth-btn"
                id="loginBtn">

                Login

            </button>

        </form>


        <p
            id="loginMessage"
            class="auth-message">
        </p>


        <div class="auth-links">

            <a href="signup.html">
                নতুন Account তৈরি করুন
            </a>

            <a href="home.html">
                ← Home
            </a>

        </div>

    </div>

</div>


<script
    type="module"
    src="../js/login.js">
</script>

</body>
